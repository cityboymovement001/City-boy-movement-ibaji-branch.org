<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | City-Boy Movement Ibaji Branch</title>

  <meta name="description" content="Contact City-Boy Movement Ibaji Branch directly through WhatsApp.">

  <meta name="theme-color" content="#087f23">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8f5;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #087f23, #005c1a);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
      opacity: 0.95;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .contact-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .contact-box h2 {
      color: #087f23;
      text-align: center;
      margin-bottom: 10px;
      font-size: 25px;
    }

    .contact-box .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
      font-family: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: #087f23;
      box-shadow: 0 0 0 2px rgba(8,127,35,0.1);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .whatsapp-btn {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .whatsapp-btn:hover {
      background: #1ebe5d;
      transform: translateY(-1px);
    }

    .whatsapp-icon {
      margin-right: 8px;
    }

    .direct-contact {
      text-align: center;
      margin-top: 25px;
      padding: 18px;
      background: #f0f8f1;
      border-radius: 10px;
    }

    .direct-contact strong {
      color: #087f23;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      margin-top: 40px;
      background: #087f23;
      color: white;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .contact-box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>City-Boy Movement Ibaji Branch</h1>
    <p>Connect with us directly</p>
  </header>

  <div class="container">

    <div class="contact-box">

      <h2>Contact Us</h2>

      <p class="intro">
        Send us a message through WhatsApp. Fill in your details below and
        click the button to send your message.
      </p>

      <form id="whatsappForm">

        <label for="name">Your Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
          required
        >

        <label for="message">Your Message</label>
        <textarea
          id="message"
          placeholder="Write your message here..."
          required
        ></textarea>

        <button type="submit" class="whatsapp-btn">
          <span class="whatsapp-icon">💬</span>
          Send Message on WhatsApp
        </button>

      </form>

      <div class="direct-contact">
        <p>
          <strong>WhatsApp:</strong><br>
          +234 706 396 9564
        </p>
      </div>

    </div>

  </div>

  <footer>
    © 2026 City-Boy Movement Ibaji Branch. All Rights Reserved.
  </footer>

  <script>
    document.getElementById("whatsappForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const message = document.getElementById("message").value.trim();

      const whatsappNumber = "2347063969564";

      const whatsappMessage =
        "Hello City-Boy Movement Ibaji Branch,%0A%0A" +
        "*New Contact Message*%0A%0A" +
        "*Name:* " + encodeURIComponent(name) + "%0A" +
        "*Phone:* " + encodeURIComponent(phone) + "%0A%0A" +
        "*Message:*%0A" + encodeURIComponent(message);

      const whatsappURL =
        "https://wa.me/" + whatsappNumber + "?text=" + whatsappMessage;

      window.open(whatsappURL, "_blank");

    });
  </script>

</body>
</html>
